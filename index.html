<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Course Follow-up Tracker</title><meta name="theme-color" content="#2458d6"><link rel="manifest" href="/manifest.json"><link rel="icon" href="/icon.svg"><style>
body{margin:0;font:14px Arial;background:#f5f7fb;color:#172033}header{height:60px;background:#fff;border-bottom:1px solid #e5e8ee;display:flex;align-items:center;justify-content:space-between;padding:0 20px}.brand{font-weight:800;font-size:18px}.layout{display:flex;min-height:calc(100vh - 61px)}aside{width:210px;background:#fff;border-right:1px solid #e5e8ee;padding:15px}aside button{display:block;width:100%;padding:11px;border:0;background:transparent;text-align:left;border-radius:8px;margin:3px 0;cursor:pointer}aside button:hover{background:#edf2ff}main{flex:1;padding:22px;max-width:1450px;margin:auto;width:100%}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card,.panel{background:#fff;border:1px solid #e4e8ef;border-radius:12px;padding:16px}.num{font-size:27px;font-weight:800;margin-top:7px}.muted{color:#6b7587}.toolbar{display:flex;gap:8px;margin:14px 0;flex-wrap:wrap}input,select,textarea{padding:9px;border:1px solid #d5dbe5;border-radius:7px}.btn{padding:9px 13px;border:0;border-radius:7px;font-weight:700;cursor:pointer}.primary{background:#2458d6;color:#fff}.secondary{background:#edf0f5}.wa{background:#1fa855;color:#fff}table{width:100%;border-collapse:collapse;background:#fff}th,td{padding:10px;border-bottom:1px solid #edf0f4;text-align:left;font-size:13px}.badge{padding:4px 7px;border-radius:12px;font-size:11px;font-weight:700}.high{background:#ffe2df;color:#b72c20}.medium{background:#fff0c4;color:#8b6500}.low{background:#e8eef7;color:#50627b}.login{min-height:100vh;display:flex;align-items:center;justify-content:center}.loginbox{width:350px;background:#fff;padding:28px;border-radius:14px;box-shadow:0 10px 40px #0001}.loginbox input{width:100%;box-sizing:border-box;margin:7px 0 14px}.row{display:flex;align-items:center;justify-content:space-between;gap:8px}@media(max-width:800px){aside{width:55px}aside button{font-size:0}.cards{grid-template-columns:1fr 1fr}main{padding:12px}table{display:block;overflow:auto}}
</style></head><body><div id="app"></div><script>
let me=null,page='dashboard',leads=[],templates=[];const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(url,opt={}){let r=await fetch(url,{...opt,headers:{'Content-Type':'application/json',...(opt.headers||{})}});if(r.status===401){login();throw new Error('login')};let d=await r.json();if(!r.ok)throw new Error(d.error||'Request failed');return d}
function login(){document.body.innerHTML='<div class=login><div class=loginbox><h2>Course Follow-up Tracker</h2><p class=muted>Shared volunteer workspace</p><form onsubmit="doLogin(event)"><label>Email</label><input id=email required><label>Password</label><input id=password type=password required><button class="btn primary" style="width:100%">Sign in</button></form></div></div>'}
async function doLogin(e){e.preventDefault();try{let d=await api('/api/auth/login',{method:'POST',body:JSON.stringify({email:$('email').value,password:$('password').value})});me=d.user;render()}catch(x){alert(x.message)}}if('serviceWorker' in navigator){navigator.serviceWorker.register('/sw.js').catch(()=>{});}
async function init(){try{me=(await api('/api/auth/me')).user;render()}catch{login()}}
async function render(){document.body.innerHTML=`<header><div class=brand>📋 Course Follow-up Tracker</div><div>${esc(me.name)} · ${me.role} <button class="btn secondary" onclick="logout()">Logout</button></div></header><div class=layout><aside><button onclick="page='dashboard';render()">📊 Dashboard</button><button onclick="page='leads';render()">👥 Leads</button><button onclick="page='whatsapp';render()">💬 WhatsApp</button>${me.role==='admin'?'<button onclick="page=\'volunteers\';render()">🧑‍🤝‍🧑 Volunteers</button>':''}</aside><main id=main></main></div>`;if(page==='dashboard')dashboard();if(page==='leads')leadPage();if(page==='whatsapp')waPage();if(page==='volunteers')volPage()}
function table(ls){return `<table><tr><th></th><th>Priority</th><th>Name</th><th>Course</th><th>Status</th><th>Next follow-up</th><th>Volunteer</th></tr>${ls.map(l=>`<tr><td>${l.select?`<input type=checkbox class=sel value="${l.id}">`:''}</td><td><span class="badge ${String(l.priority||'').toLowerCase()}">${esc(l.priority||'')} ${l.score!=null?'· '+l.score:''}</span></td><td><b>${esc(l.name)}</b><br>${esc(l.phone)}</td><td>${esc(l.course)}</td><td>${esc(l.status)}</td><td>${esc(l.next_followup||'—')}</td><td>${esc(l.volunteer_name||'Unassigned')}</td></tr>`).join('')}</table>`}
async function dashboard(){let d=await api('/api/dashboard');$('main').innerHTML=`<h2>Dashboard</h2><p class=muted>Shared live workspace</p><div class=cards>${Object.entries(d.stats).map(([k,v])=>`<div class=card><div class=muted>${k}</div><div class=num>${v}</div></div>`).join('')}</div><br><div class=panel><h3>Priority queue</h3>${table(d.leads)}</div>`}
async function leadPage(){leads=await api('/api/leads');$('main').innerHTML=`<div class=row><div><h2>Leads</h2><p class=muted>All changes are stored in PostgreSQL.</p></div><button class="btn primary" onclick="addLead()">+ Add lead</button></div><div class=toolbar><input id=q placeholder="Search..." oninput="filterLeads()"><select id=pf onchange="filterLeads()"><option value="">All priorities</option><option>High</option><option>Medium</option><option>Low</option></select></div><div class=panel id=lt></div>`;filterLeads()}
function filterLeads(){let q=($('q')?.value||'').toLowerCase(),p=$('pf')?.value||'';let x=leads.filter(l=>(!q||[l.name,l.phone,l.course].join(' ').toLowerCase().includes(q))&&(!p||l.priority===p));$('lt').innerHTML=table(x)}
async function addLead(){let name=prompt('Name');if(!name)return;let phone=prompt('WhatsApp number');let course=prompt('Course','Happiness Program');let next=prompt('Next follow-up (YYYY-MM-DD)');try{await api('/api/leads',{method:'POST',body:JSON.stringify({name,phone,course,next_followup:next,interest:'Warm',status:'Interested'})});leadPage()}catch(e){alert(e.message)}}
async function waPage(){leads=(await api('/api/leads')).map(x=>({...x,select:true}));templates=await api('/api/templates');$('main').innerHTML=`<h2>WhatsApp follow-up</h2><p class=muted>Messages are queued server-side. Production sending should use an approved WhatsApp Business API.</p><div class=panel><select id=tpl>${templates.map(t=>`<option value=${t.id}>${esc(t.name)}</option>`).join('')}</select> <button class="btn wa" onclick="sendWA()">Queue selected & open WhatsApp</button><br><br>${table(leads)}</div>`}
async function sendWA(){let ids=[...document.querySelectorAll('.sel:checked')].map(x=>Number(x.value));if(!ids.length)return alert('Select leads');try{let out=await api('/api/messages/queue',{method:'POST',body:JSON.stringify({lead_ids:ids,template_id:Number($('tpl').value)})});out.forEach((x,i)=>setTimeout(()=>window.open('https://wa.me/'+x.phone+'?text='+encodeURIComponent(x.body),'_blank'),i*600));alert(out.length+' messages queued/opened.')}catch(e){alert(e.message)}}
async function volPage(){let vs=await api('/api/volunteers');$('main').innerHTML=`<h2>Volunteers</h2><div class=panel><button class="btn primary" onclick="newVol()">+ Add volunteer</button><br><br><table><tr><th>Name</th><th>Email</th><th>Leads</th><th>Hot</th><th>Status</th></tr>${vs.map(v=>`<tr><td>${esc(v.name)}</td><td>${esc(v.email)}</td><td>${v.lead_count}</td><td>${v.hot_count}</td><td>${v.active?'Active':'Inactive'}</td></tr>`).join('')}</table></div>`}
async function newVol(){let name=prompt('Name'),email=prompt('Email'),password=prompt('Temporary password (10+ chars)');if(name&&email&&password)try{await api('/api/volunteers',{method:'POST',body:JSON.stringify({name,email,password})});volPage()}catch(e){alert(e.message)}}async function logout(){await api('/api/auth/logout',{method:'POST'});login()}init();
</script></body></html>
