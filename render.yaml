services:
  - type: web
    name: course-followup-tracker
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install --omit=dev
    startCommand: node seed.js && node server.js
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: course-tracker-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"

databases:
  - name: course-tracker-db
    plan: free
    region: singapore
    databaseName: course_tracker
    user: course_tracker_user
