services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: course_tracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  app:
    build: .
    restart: unless-stopped
    depends_on: [db]
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/course_tracker
      JWT_SECRET: change-this-in-production
      COOKIE_SECURE: "false"
    ports: ["3000:3000"]
volumes: {pgdata: {}}
